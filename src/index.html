<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <title>NetNest - Premium E-commerce Store</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <meta name="description" content="Discover premium products at NetNest. Quality items, great prices, and excellent service. Shop now for the best deals online.">
  <meta name="keywords" content="e-commerce, online shopping, premium products, NetNest, quality items, great prices">
  <meta name="author" content="NetNest Team">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="NetNest - Premium E-commerce Store">
  <meta property="og:description" content="Discover premium products at NetNest. Quality items, great prices, and excellent service.">
  <meta property="og:image" content="/assets/images/og-image.jpg">
  <meta property="og:url" content="https://yourdomain.com">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NetNest">
  <meta property="og:locale" content="lv_LV">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NetNest - Premium E-commerce Store">
  <meta name="twitter:description" content="Discover premium products at NetNest. Quality items, great prices, and excellent service.">
  <meta name="twitter:image" content="/assets/images/twitter-image.jpg">

  <meta name="theme-color" content="#8B0000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="canonical" href="https://yourdomain.com/">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<app-root></app-root>

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "NetNest",
    "description": "Premium E-commerce Store",
    "url": "https://yourdomain.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://yourdomain.com/products?search={search_term_string}",
      "query-input": "required name=search_term_string"
    },
    "publisher": {
      "@type": "Organization",
      "name": "NetNest",
      "logo": {
        "@type": "ImageObject",
        "url": "https://yourdomain.com/assets/images/logo.png"
      }
    }
  }
</script>
</body>
</html>
